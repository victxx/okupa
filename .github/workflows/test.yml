name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # bearssl.org refuses shallow fetches of a single commit.
          fetch-depth: 0
      - name: Test
        run: make -j4 test CC=${{ matrix.cc }}
      - name: Test with sanitizers
        run: make sanitize CC=${{ matrix.cc }}
