name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test
        run: make test CC=${{ matrix.cc }}
      - name: Test with sanitizers
        run: make sanitize CC=${{ matrix.cc }}
