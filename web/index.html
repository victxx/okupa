<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okupa</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#home">Okupa</a>
    <nav aria-label="Sections">
      <a href="#gift">Give</a><a href="#mailbox">Mailbox</a><a href="#cave-room">Cave</a><a href="#visit-room">Visit</a><a href="#log-room">Log</a>
    </nav>
    <select id="net" aria-label="Network"></select>
  </header>

  <section id="home" class="hero">
    <canvas id="scene" width="256" height="192" aria-label="Your okupa in its attic. Click to pet it."></canvas>
    <aside class="who">
      <p class="eyebrow">Your okupa</p>
      <h1 id="addr" class="mono">…</h1>
      <label>Friend code <input id="mycode" readonly class="mono"></label>
      <p class="muted" id="balance"></p>
      <button id="fund" class="ghost" hidden>Fund from local dev chains</button>
      <p id="netlabel" class="muted small"></p>
    </aside>
  </section>

  <main>
    <section id="gift" class="card span2">
      <h2>Give a gift</h2>
      <label>To <input id="to" class="mono" placeholder="friend code 0x…:04…, or a DSi address"></label>
      <div class="two">
        <div>
          <h3>Small <span class="tag">64×64 · on Ethereum</span></h3>
          <canvas id="sketch" width="256" height="256" aria-label="64 by 64 drawing"></canvas>
          <div class="row" id="tones"></div>
          <div class="row">
            <button id="sendInline">Send small gift</button>
            <button id="sendSwarm" class="ghost">Send privately</button>
            <button id="clear" class="ghost">New page</button>
          </div>
        </div>
        <div>
          <h3>Big <span class="tag">a photo · to the cave</span></h3>
          <canvas id="bigPreview" class="big" width="256" height="192" aria-label="Big picture preview, 256 by 192"></canvas>
          <div class="row">
            <label class="file">Choose a photo<input id="photo" type="file" accept="image/*"></label>
            <button id="sendBig" disabled>Send big gift</button>
          </div>
        </div>
      </div>
    </section>

    <section id="mailbox" class="card">
      <div class="head"><h2>Mailbox</h2><button id="check" class="ghost">Check</button></div>
      <ol id="mail" class="list"></ol>
      <div id="wall" class="wall"></div>
    </section>

    <section id="cave-room" class="card">
      <h2>The cave</h2>
      <div id="cave" class="cave"></div>
    </section>

    <section id="visit-room" class="card span2">
      <h2>Visit an okupa</h2>
      <div class="row"><input id="visitAddr" class="mono" placeholder="0x… address"><select id="visitNet" aria-label="Network to visit on"></select><select id="visitVia" aria-label="How to read"></select><button id="visit" class="ghost">Visit</button></div>
      <div id="visitOut" class="wall"></div>
    </section>

    <section id="log-room" class="card span2">
      <h2>What really happened</h2>
      <ol id="log"></ol>
    </section>
  </main>

  <dialog id="look"><canvas id="lookCanvas" width="256" height="192"></canvas><p id="lookInfo" class="mono muted"></p><button id="lookClose" class="ghost">Close</button></dialog>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
