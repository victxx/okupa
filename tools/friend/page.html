<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okupa: play</title>
<style>
:root{--bg:#1b1c1e;--fg:#e9e7e2;--mute:#8f8e8a;--line:rgba(255,255,255,.1);--paper:#ebe9e4;--ink:#17181a;--ok:#9fd39a;--no:#e3957f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}
p{margin:6px 0;color:var(--mute)}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 13px}
input{width:100%;background:rgba(255,255,255,.05);color:var(--fg)}
button{background:var(--fg);color:var(--bg);font-weight:600;border:0;cursor:pointer}
button.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}
.frame{background:var(--paper);padding:10px;border-radius:6px;margin:12px 0}
canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;touch-action:none}
.score{font-size:14px;color:var(--mute)}
.list{margin:8px 0;padding:0;list-style:none}.list li{padding:6px 0;border-top:1px solid var(--line)}
.big{font-size:20px;color:var(--fg)}
.ok{color:var(--ok)}.no{color:var(--no)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Okupa</h1>
<p class="score" id="score">A game with whoever holds the DS.</p>
<section id="join">
<p>Type the code the DS shows, and your name.</p>
<div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="Code"><input id="name" maxlength="16" placeholder="Your name"></div>
<button id="go" style="width:100%">Play</button>
<p id="err" class="no"></p>
</section>
<section id="wait" hidden><p class="big">Waiting for the DS player to start a round…</p></section>
<section id="guess" hidden>
<p class="big">The DS player is drawing. What is it?</p>
<div class="frame"><canvas id="theirs" width="64" height="64"></canvas></div>
<div class="row"><input id="g" maxlength="24" placeholder="Your guess"><button id="send" style="flex:0 0 auto">Guess</button></div>
<ul class="list" id="mine"></ul>
</section>
<section id="draw" hidden>
<p class="big">Your turn: draw something for the DS player to guess.</p>
<div class="frame"><canvas id="pad" width="64" height="64"></canvas></div>
<div class="row"><button class="ghost" id="clear">Clear</button><button class="ghost" id="gift">Give it to the okupa</button></div>
<p id="verdict"></p>
<div class="row" id="judge" hidden><button id="yes">Right!</button><button class="ghost" id="nope">Nope</button></div>
</section>
<p id="note"></p>
</main>
<script>
const $=id=>document.getElementById(id);
let code="",timer=null,round=-1,mode=-1,ink=new Uint8Array(512),sending=0;
function api(path,body){return fetch(path+(path.includes("?")?"&":"?")+"c="+code,{method:body==null?"GET":"POST",body}).then(r=>{if(r.status==403)throw new Error("wrong code");return r});}
function paint(cv,bits){const x=cv.getContext("2d"),img=x.createImageData(64,64);for(let i=0;i<4096;i++){const on=bits[i>>3]&(128>>(i&7)),c=on?[23,24,26]:[235,233,228];img.data.set([c[0],c[1],c[2],255],i*4);}x.putImageData(img,0,0);}
function hexBits(h){const b=new Uint8Array(512);for(let i=0;i<512;i++)b[i]=parseInt(h.substr(2*i,2),16);return b;}
function bitsHex(b){return Array.from(b,v=>v.toString(16).padStart(2,"0")).join("");}
function show(id){for(const s of["join","wait","guess","draw"])$(s).hidden=s!==id;}
async function poll(){
 try{
  const s=await (await api("/s")).json();
  $("score").textContent=`${s.name} ${s.you} · DS ${s.ds}`;
  if(s.mode!==mode||s.round!==round){mode=s.mode;round=s.round;$("mine").replaceChildren();ink.fill(0);paint($("pad"),ink);$("verdict").textContent="";}
  if(s.mode===2){show("guess");paint($("theirs"),hexBits(s.drawing));$("mine").replaceChildren(...s.guesses.map(g=>{const li=document.createElement("li");li.textContent=g;return li;}));}
  else if(s.mode===3){show("draw");
   $("judge").hidden=s.judged!==1;
   $("verdict").innerHTML=s.judged===1?`The DS player says: <b class="big"></b>`:s.judged===2?`<span class="ok">They got it!</span> New round soon.`:s.judged===3?`<span class="no">Not that.</span> Keep drawing.`:"Draw away: they see it as you go.";
   if(s.judged===1)$("verdict").querySelector("b").textContent=s.guess;}
  else show("wait");
  $("note").textContent="";
 }catch(e){$("note").textContent=e.message==="wrong code"?"The code changed: reload.":"The DS is not answering (same Wi-Fi?).";}
}
$("go").onclick=async()=>{
 code=$("code").value.trim();
 try{await api("/n",$("name").value.trim()||"Friend");$("err").textContent="";show("wait");poll();timer=setInterval(poll,800);}
 catch(e){$("err").textContent=e.message==="wrong code"?"That is not the code on the DS.":"Can't reach the DS: same Wi-Fi?";}
};
$("send").onclick=async()=>{const g=$("g").value.trim();if(!g)return;$("g").value="";await api("/g",g);poll();};
$("g").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click();});
$("yes").onclick=()=>api("/j?ok=1","").then(poll);
$("nope").onclick=()=>api("/j?ok=0","").then(poll);
$("clear").onclick=()=>{ink.fill(0);paint($("pad"),ink);push();};
$("gift").onclick=async()=>{await api("/h",bitsHex(ink));$("verdict").textContent="Given! The DS player decides if it goes on the wall.";};
function push(){if(sending)return;sending=1;setTimeout(()=>{sending=0;api("/d",bitsHex(ink)).catch(()=>{});},250);}
let last=null;
function dot(x,y){if(x<0||y<0||x>63||y>63)return;ink[(y*64+x)>>3]|=128>>((y*64+x)&7);}
function line(a,b){const n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]),1);for(let i=0;i<=n;i++)dot(Math.round(a[0]+(b[0]-a[0])*i/n),Math.round(a[1]+(b[1]-a[1])*i/n));}
function at(e){const r=$("pad").getBoundingClientRect();return[Math.floor((e.clientX-r.left)*64/r.width),Math.floor((e.clientY-r.top)*64/r.height)];}
$("pad").addEventListener("pointerdown",e=>{$("pad").setPointerCapture(e.pointerId);last=at(e);line(last,last);paint($("pad"),ink);});
$("pad").addEventListener("pointermove",e=>{if(!last)return;const p=at(e);line(last,p);last=p;paint($("pad"),ink);push();});
$("pad").addEventListener("pointerup",()=>{last=null;push();});
paint($("pad"),ink);
</script>
</body>
</html>
